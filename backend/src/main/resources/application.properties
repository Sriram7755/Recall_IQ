spring.application.name=backend
server.port=${PORT:8080}

# Import local configuration overrides if present (ignored by Git)
spring.config.import=optional:classpath:application-local.properties

# MongoDB Database connection URI
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# GitHub OAuth Configurations
github.client-id=${GITHUB_CLIENT_ID}
github.client-secret=${GITHUB_CLIENT_SECRET}
github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/api/auth/callback}
github.extension-redirect-base=https://%s.chromiumapp.org/oauth

# Security & Encryption Configurations
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.encryption.secret-key=${ENCRYPTION_SECRET_KEY}

# OpenRouter API Key for topic classification
openrouter.api.key=${OPENROUTER_API_KEY}
github.branch=main
logging.level.org.springframework.web=DEBUG