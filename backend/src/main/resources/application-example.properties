# RecallIQ - Example Configuration Template (Safe to Commit)
spring.application.name=backend
server.port=${PORT:8080}

# MongoDB Configuration
spring.data.mongodb.uri=YOUR_MONGODB_ATLAS_CONNECTION_URI

# GitHub OAuth Configurations
github.client-id=YOUR_GITHUB_OAUTH_CLIENT_ID
github.client-secret=YOUR_GITHUB_OAUTH_CLIENT_SECRET
github.redirect-uri=http://localhost:8080/api/auth/callback
github.extension-redirect-base=https://%s.chromiumapp.org/oauth

# Security & Encryption Configurations
app.jwt.secret=YOUR_SECURE_JWT_SIGNING_KEY_MIN_256_BITS
app.jwt.expiration-ms=86400000
app.encryption.secret-key=YOUR_AES_256_GCM_SECRET_KEY_32_CHARS

# OpenRouter API Key for Topic Classification
openrouter.api.key=YOUR_OPENROUTER_API_KEY
github.branch=main
logging.level.org.springframework.web=DEBUG
